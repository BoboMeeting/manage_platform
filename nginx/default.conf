# BoboMeet 管理平台：HLS 点播静态服务
# 与 backend 共享 media-storage 卷：/media/videos/{id}/hls/master.m3u8 → 卷内 videos/{id}/hls/
# 内网阶段无签名直出；上线加签时在 location /media/ 内启用 secure_link（与后端 HMAC 签名同构）
server {
    listen 80;
    server_name _;

    # 字幕 vtt 等文本文件按 utf-8 输出
    charset utf-8;

    location /media/ {
        alias /usr/share/nginx/html/media/;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                 ts;
            text/vtt                   vtt;
        }
        default_type application/octet-stream;

        # hls.js / 管理端前端跨源拉流所需
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers Content-Length,Content-Range always;

        # m3u8 清单不缓存（流水线重跑会覆盖同路径文件，需及时生效）
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # ts 分片内容不可变（重跑前会整目录清理重建），长缓存
        location ~* \.ts$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin * always;
        }
    }

    # 容器健康检查/探活
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
