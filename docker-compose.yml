services:
  # ============================================================================
  # 后端服务：.NET 10 Web API
  # ============================================================================
  backend:
    # 强制 amd64 平台，避免在 x86 服务器上拉到 arm64 镜像导致 exec format error
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: bobomeet-manager-backend:latest
    container_name: bobomeet-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5080}:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5080

      # PostgreSQL 连接（指向同 compose 的 postgres 服务）
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-bobomeet_manager};
        Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:-admin123};
        Include Error Detail=true

      # JWT 配置（生产环境必须通过 .env 覆盖 Secret）
      # 注意：JWT_SECRET 必须与调度服务(meet_schedule_server)的 Auth__JwtSecret 一致
      Jwt__Issuer: ${JWT_ISSUER:-BoboMeet.ManagerPlatform}
      Jwt__Audience: ${JWT_AUDIENCE:-BoboMeet.Client}
      Jwt__Secret: ${JWT_SECRET:?必须在 .env 中提供 JWT_SECRET，建议 32 字节以上；且须与调度服务 Auth__JwtSecret 相同}
      Jwt__ExpiresSeconds: ${JWT_EXPIRES_SECONDS:-604800}

      # 调度服务（meet_schedule_server）地址
      # Internal：backend 容器 → 调度服务的服务间调用（/api/v1/internal/*）
      #   调度服务跑在【宿主机】时默认 http://host.docker.internal:5000
      #   （容器内 localhost 指向容器自身、不是宿主机）；
      #   若调度服务也容器化且在同一网络，可在 .env 改为服务名 http://scheduler:5000
      # External：返回给 App 客户端的可达地址（App 在宿主机/用户机器上运行，
      #   localhost 即宿主机；生产环境请在 .env 改为服务器 IP/域名）
      Scheduler__InternalBaseUrl: ${SCHEDULER_INTERNAL_URL:-http://host.docker.internal:5000}
      Scheduler__ExternalBaseUrl: ${SCHEDULER_EXTERNAL_URL:-http://host.docker.internal:5000}

      # 视频媒体配置（本期：本地磁盘存储 + ffmpeg 原分辨率流复制切片/打包，不转码；字幕模拟流转）
      # StorageRoot：媒体文件根目录（原始视频/HLS/字幕，单文件最大 2GB）。
      #   默认 /app/storage（相对路径会基于 /app 解析），务必挂卷持久化，否则重建容器丢视频；
      #   需要大容量磁盘时，可在 .env 改容器内路径，或把下方 media-storage 卷改为 bind mount
      # FFprobePath / FFmpegPath：可执行文件路径（镜像已内置 ffmpeg，默认取 PATH 即可）
      # SimulatedStageSeconds：字幕模拟阶段时长（秒），前端联调用
      Media__StorageRoot: ${MEDIA_STORAGE_ROOT:-/app/storage}
      Media__FFprobePath: ${MEDIA_FFPROBE_PATH:-ffprobe}
      Media__FFmpegPath: ${MEDIA_FFMPEG_PATH:-ffmpeg}
      Media__SimulatedStageSeconds: ${MEDIA_SIMULATED_STAGE_SECONDS:-3}
      # HLS 点播对外基址（nginx 静态服务），play-url 返回 {PublicBaseUrl}/videos/{id}/hls/master.m3u8
      # 返回给客户端/管理端前端拼接播放地址，localhost 指客户端本机；生产改服务器 IP/域名
      Media__PublicBaseUrl: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:8088/media}

      # ===== RAG（知识库）=====
      # EmbeddingDim 为 kb_chunks 向量列的唯一定长来源，容器内必须与 appsettings.json(1024) 一致；
      # 换模型/维度 = 重建 kb_chunks（服务启动即按此维度建表）。ApiKey 本地 TEI 可留空。
      Rag__EmbeddingBaseUrl: ${RAG_EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      Rag__EmbeddingApiKey: ${RAG_EMBEDDING_API_KEY:-}
      Rag__EmbeddingModel: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      Rag__EmbeddingDim: ${RAG_EMBEDDING_DIM:-1024}
      Rag__EmbeddingTimeoutSeconds: ${RAG_EMBEDDING_TIMEOUT:-60}
      # 二期开关（默认关闭，行为与一期一致）
      Rag__EnableRerank: ${RAG_ENABLE_RERANK:-false}
      # rerank 精排（P3，硅基流动 /v1/rerank）；Key 可与 OCR 共用同一个硅基流动 Key。
      # 候选 ≤3 跳过、超时/报错/Key 为空时均回退向量检索原始顺序，不影响检索可用性
      Rag__RerankBaseUrl: ${RAG_RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      Rag__RerankApiKey: ${RAG_RERANK_API_KEY:-}
      Rag__RerankModel: ${RAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      Rag__RerankCandidateTopN: ${RAG_RERANK_CANDIDATE_TOPN:-20}
      Rag__RerankTimeoutSeconds: ${RAG_RERANK_TIMEOUT:-20}
      Rag__EnableHybrid: ${RAG_ENABLE_HYBRID:-false}

      # ===== OCR（扫描版 PDF 兜底，硅基流动 PaddleOCR-VL）=====
      # 仅当 PDF 平均每页有效字符低于 Ocr__MinCharsPerPage 时整篇转 Markdown；
      # ApiKey 留空则扫描件直接判 Failed（错误信息提示配置项），正常文本层 PDF 不受影响
      Ocr__Enabled: ${OCR_ENABLED:-true}
      Ocr__BaseUrl: ${OCR_BASE_URL:-https://api.siliconflow.cn/v1}
      Ocr__ApiKey: ${OCR_API_KEY:-}
      Ocr__Model: ${OCR_MODEL:-PaddlePaddle/PaddleOCR-VL-1.5}
    extra_hosts:
      # 允许容器通过 host.docker.internal 访问宿主机（调度服务在宿主机上运行时必需）
      # Docker Desktop for Windows/Mac 原生支持；Linux 上由 host-gateway 显式映射
      - "host.docker.internal:host-gateway"
    volumes:
      # DataProtection 密钥持久化（避免重启容器后旧 cookie 失效）
      - dp-keys:/app/.dp-keys
      # 媒体文件持久化（视频/HLS/字幕，容量随上传增长，注意宿主机磁盘空间）
      - media-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bobomeet
    healthcheck:
      # 镜像内无 curl，使用随镜像发布的 HealthCheck 小工具（dotnet 运行时）探测 /healthz
      test: ["CMD", "dotnet", "/app/healthcheck/HealthCheck.dll", "http://127.0.0.1:5080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # PostgreSQL 数据库
  # ============================================================================
  postgres:
    # 内置 pgvector 扩展，用于知识库向量检索（kb_chunks.embedding vector(1024)）
    image: pgvector/pgvector:pg17
    platform: linux/amd64
    container_name: bobomeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bobomeet_manager}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      # pgvector/pgvector 基于官方 postgres 镜像，数据目录为 /var/lib/postgresql/data
      # （原 bitnami 镜像使用 /bitnami/postgresql，已随镜像切换一并重建开发库）
      - postgres-data-v2:/var/lib/postgresql/data
    # 不暴露端口到宿主机，仅容器网络内可访问（提升安全性）
    # 如需从宿主机直接连接 DB 调试，取消下面注释
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bobomeet_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bobomeet

  # ============================================================================
  # nginx：HLS 点播静态服务（内网阶段无签名直出 /media/）
  #   与 backend 共享 media-storage 卷（只读），backend 切片产物 nginx 即刻可见；
  #   上线加签时在 default.conf 启用 secure_link，与后端 SignPlaybackToken 同构
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    container_name: bobomeet-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      # /media/videos/{id}/hls/master.m3u8 → 卷内 videos/{id}/hls/master.m3u8
      - media-storage:/usr/share/nginx/html/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - bobomeet

volumes:
  postgres-data-v2:
  dp-keys:
  media-storage:

networks:
  bobomeet:
    driver: bridge
